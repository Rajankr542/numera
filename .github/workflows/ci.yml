name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.7.6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Reuse downloaded wheels across runs; PyPI downloads on hosted
          # runners occasionally stall and time out.
          cache: pip
          cache-dependency-path: python/requirements.txt
      - name: Python reference environment
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_PROGRESS_BAR: "off"
        run: |
          python -m venv .venv
          # Longer socket timeout + per-request retries, and retry the whole
          # install a few times in case a download still times out.
          for attempt in 1 2 3; do
            .venv/bin/pip install --timeout 60 --retries 10 -r python/requirements.txt && break
            if [ "$attempt" -eq 3 ]; then
              echo "pip install failed after $attempt attempts" >&2
              exit 1
            fi
            echo "pip install failed (attempt $attempt), retrying in 20s" >&2
            sleep 20
          done
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test:native
      - run: pnpm test
      - run: pnpm test:diff
      - name: NumPy API + benchmark coverage (D-032)
        run: pnpm api:check
      - name: Sanitizers (ASan + UBSan)
        if: matrix.node == 22
        run: pnpm test:asan

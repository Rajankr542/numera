# Automatic release (DECISIONS D-029; D-027 for GitHub Packages).
# Every push to main / beta / alpha works out the next version from the
# Conventional Commits since the last stable tag (scripts/next-version.mjs):
#   fix/perf/revert -> patch, feat -> minor, "type!:" / BREAKING CHANGE -> major,
#   docs/chore/test/ci/build/refactor/style only -> no release.
#   main  -> X.Y.Z          on npm dist-tag "latest" (+ GitHub Release, latest)
#   beta  -> X.Y.Z-beta.N   on npm dist-tag "beta"   (+ GitHub pre-release)
#   alpha -> X.Y.Z-alpha.N  on npm dist-tag "alpha"  (+ GitHub pre-release)
# It builds the 4 prebuilds, smoke-tests the self-contained tarball and
# publishes @cyfora/numera to npmjs.org with the NPM_TOKEN secret (a granular
# token with "bypass 2FA", so no prompt), tags vX.Y.Z[-ch.N]; stable releases
# also commit the version to package.json. "Run workflow" can force a release.
name: Release

on:
  push:
    branches: [main, beta, alpha]
    paths-ignore: ["**.md", "docs/**", "benchmarks/**"]
  workflow_dispatch:
    inputs:
      bump:
        description: "auto = from commits; or force patch/minor/major"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      registry:
        description: "Where to publish (npm needs the NPM_TOKEN secret)"
        type: choice
        options: [npm, github, both]
        default: npm
      dry_run:
        description: "Build and test everything but do not publish, push or release"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "8.7.6"

jobs:
  prepare:
    runs-on: ubuntu-latest
    # The release commit made by this workflow ("chore(release): ...") must not
    # trigger another release (GITHUB_TOKEN pushes do not re-trigger anyway).
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    outputs:
      release: ${{ steps.v.outputs.release }}
      version: ${{ steps.v.outputs.version }}
      dist_tag: ${{ steps.v.outputs.dist_tag }}
    steps:
      - name: Channel from branch
        id: ch
        run: |
          case "$GITHUB_REF_NAME" in
            main) echo "channel=latest" >> "$GITHUB_OUTPUT" ;;
            beta|alpha) echo "channel=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Releases run from main, beta or alpha (got $GITHUB_REF_NAME)"; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: v
        name: Choose version from commits
        env:
          CHANNEL: ${{ steps.ch.outputs.channel }}
          BUMP: ${{ inputs.bump || 'auto' }}
        run: |
          # Versions already on npm (prerelease numbers must not be reused).
          published=$(npm view "$(node -p "require('./packages/numera/package.json').name")" versions --json 2>/dev/null || echo '[]')
          node scripts/next-version.mjs "$CHANNEL" --published "$published" --bump "$BUMP"
          # shellcheck disable=SC1090
          . <(grep -E '^(release|version)=' "$GITHUB_OUTPUT")
          if [ "$release" = true ] && git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists."
            exit 1
          fi
          if [ "$release" = true ]; then
            echo "### Releasing \`$version\` on npm dist-tag \`$CHANNEL\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### No release: only docs/chore/test/ci/refactor commits since the last tag" >> "$GITHUB_STEP_SUMMARY"
          fi

  prebuild-linux:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Builds in manylinux_2_28 Docker on a native-arch runner, so the full
      # vitest suite and the smoke test run against the fresh addon (D-026).
      - run: node scripts/build-prebuilds.mjs --targets ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.target }}
          path: packages/numera/prebuilds
          if-no-files-found: error

  prebuild-macos:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build tools (cmake, ninja)
        run: |
          python -m venv .venv
          .venv/bin/pip install -q cmake ninja
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-prebuilds.mjs --targets darwin-arm64,darwin-x64
      - name: Test the arm64 prebuild (x64 is cross-compiled and not executed)
        env:
          NATIVPY_ADDON_PATH: ${{ github.workspace }}/packages/numera/prebuilds/darwin-arm64/nativpy.node
        run: |
          pnpm build:ts
          pnpm test
          node scripts/smoke-test.mjs ./packages/numera/dist/index.js
      - uses: actions/upload-artifact@v4
        with:
          name: prebuild-darwin
          path: packages/numera/prebuilds
          if-no-files-found: error


  publish:
    needs: [prepare, prebuild-linux, prebuild-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # version commit, tag, GitHub Release
      packages: write # GitHub Packages npm registry
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      DIST_TAG: ${{ needs.prepare.outputs.dist_tag }}
      DRY_RUN: ${{ inputs.dry_run || false }}
      # Pushes publish to npm only; GitHub Packages is opt-in via Run workflow.
      REGISTRY: ${{ inputs.registry || 'npm' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          pattern: prebuild-*
          path: packages/numera/prebuilds
          merge-multiple: true
      - name: Check all four prebuilds are present
        run: |
          for t in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            test -f "packages/numera/prebuilds/$t/nativpy.node" || { echo "::error::missing prebuild $t"; exit 1; }
          done
          file packages/numera/prebuilds/*/nativpy.node
      - run: pnpm install --frozen-lockfile
      - name: Build TypeScript and stage package files
        run: |
          pnpm build:ts
          # Self-contained README/COMPATIBILITY/LICENSE + dist (private repo, D-029).
          node scripts/stage-package.mjs
      - name: Set version
        working-directory: packages/numera
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - name: Package names
        run: |
          echo "NPM_NAME=$(node -p "require('./packages/numera/package.json').name")" >> "$GITHUB_ENV"
          # GitHub Packages only accepts names scoped to the repo owner (D-027):
          # replace any npm scope (@cyfora/numera -> @<owner>/numera, D-028).
          echo "GPR_NAME=@$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/$(node -p "require('./packages/numera/package.json').name.replace(/^@[^/]+\//, '')")" >> "$GITHUB_ENV"
      - name: Pack + smoke-test for npmjs.org
        if: env.REGISTRY != 'github'
        run: node scripts/ci-pack.mjs "$RUNNER_TEMP/pkg/npm"
      - name: Pack + smoke-test for GitHub Packages
        if: env.REGISTRY != 'npm'
        run: node scripts/ci-pack.mjs "$RUNNER_TEMP/pkg/github" --name "$GPR_NAME"

      - name: Publish to GitHub Packages
        if: env.REGISTRY != 'npm' && env.DRY_RUN != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "//npm.pkg.github.com/:_authToken=$NODE_AUTH_TOKEN" > "$RUNNER_TEMP/npmrc-gpr"
          npm publish "$RUNNER_TEMP"/pkg/github/*.tgz \
            --registry https://npm.pkg.github.com --userconfig "$RUNNER_TEMP/npmrc-gpr"
      - name: Publish to npmjs.org
        if: env.REGISTRY != 'github' && env.DRY_RUN != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo "::error::Add an NPM_TOKEN repository secret (npm granular access token, read+write on @cyfora/numera, bypass 2FA)"; exit 1; }
          echo "//registry.npmjs.org/:_authToken=$NODE_AUTH_TOKEN" > "$RUNNER_TEMP/npmrc-npm"
          npm publish "$RUNNER_TEMP"/pkg/npm/*.tgz --access public --tag "$DIST_TAG" \
            --registry https://registry.npmjs.org --userconfig "$RUNNER_TEMP/npmrc-npm"

      # Stable: commit the version to package.json. Prereleases only get a tag, so
      # package.json on main always shows the last stable version.
      - name: Commit version, tag and push
        if: env.DRY_RUN != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$DIST_TAG" = latest ]; then
            git add packages/numera/package.json
            git diff --cached --quiet || git commit -m "chore(release): $NPM_NAME@$VERSION"
          fi
          git tag -a "v$VERSION" -m "$NPM_NAME@$VERSION"
          if [ "$DIST_TAG" = latest ]; then
            git push origin "HEAD:$GITHUB_REF_NAME" "v$VERSION"
          else
            git push origin "v$VERSION"
          fi
      - name: Write release notes
        run: |
          # shellcheck disable=SC2016 # backticks are Markdown, not shell
          {
            echo "## Install"
            if [ "$REGISTRY" != github ]; then
              printf '\nFrom npm:\n\n```bash\nnpm install %s@%s\n```\n' "$NPM_NAME" "$VERSION"
              if [ "$DIST_TAG" != latest ]; then
                printf '\nLatest %s: `npm install %s@%s`\n' "$DIST_TAG" "$NPM_NAME" "$DIST_TAG"
              fi
            fi
            if [ "$REGISTRY" != npm ]; then
              printf '\nFrom GitHub Packages (add `%s:registry=https://npm.pkg.github.com` to `.npmrc`):\n' "${GPR_NAME%%/*}"
              printf '\n```bash\nnpm install %s@%s\n```\n' "$GPR_NAME" "$VERSION"
            fi
            printf '\nPrebuilt for macOS arm64/x64 (13.3+) and Linux x64/arm64 (glibc 2.28+), Node >= 18.\n'
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Create GitHub Release (latest, or pre-release for beta/alpha)
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kind=--prerelease
          [ "$DIST_TAG" = latest ] && kind=--latest
          gh release create "v$VERSION" "$RUNNER_TEMP"/pkg/*/*.tgz \
            --title "$NPM_NAME $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes --verify-tag "$kind"
      - name: Keep the tarballs of a dry run
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tarballs-dry-run
          path: ${{ runner.temp }}/pkg

